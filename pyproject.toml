[project]
name = "tasmota-motor-control-release"
version = "0.1.0"
description = "Package and sign Berry bytecode releases for TasmotaMotorControl"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
